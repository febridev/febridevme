# TLS terminates at the host nginx, which proxies to this container.
server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;

    server_tokens off;
    # Keep redirects relative so they don't leak http:// and :80 behind the proxy.
    absolute_redirect off;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml text/xml text/plain;

    location / {
        try_files $uri $uri/ $uri.html =404;
        add_header Cache-Control "no-cache";
    }

    # Astro emits content-hashed filenames here.
    location /_astro/ {
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    error_page 404 /404.html;
}
